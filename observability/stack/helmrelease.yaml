# kube-prometheus-stack: Prometheus Operator, Prometheus, Alertmanager, Grafana,
# kube-state-metrics, regole e dashboard predefinite di Kubernetes.
# Versione del chart fissata: un aggiornamento è una modifica esplicita di questo file.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "93.6.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    fullnameOverride: kube-prometheus-stack

    # k3s non espone etcd, scheduler, controller-manager e kube-proxy sulle porte che il chart
    # si aspetta: i target risulterebbero "down" e le regole relative sarebbero rumore.
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeControllerManager: false
        kubeProxy: false

    # Niente node-exporter: monta `/` dell'host con propagazione, che nei nodi k3d (container
    # dentro la VM) dà errore; il progetto usa cAdvisor (kubelet) e kube-state-metrics per i
    # pod. Conseguenza: nessuna metrica dell'host (disco, rete della VM).
    nodeExporter:
      enabled: false

    prometheus:
      prometheusSpec:
        retention: 2d
        scrapeInterval: 15s
        evaluationInterval: 15s
        # Prende tutti i ServiceMonitor, PodMonitor e PrometheusRule di ogni namespace,
        # non solo quelli con l'etichetta `release` del chart.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        # Nessun volume: i dati stanno in un emptyDir e si perdono al riavvio del pod.
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1Gi

    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

    prometheusOperator:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi

    grafana:
      # Password dell'admin da un Secret cifrato con SOPS, non nei valori del chart.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.localtest.me
        path: /
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi
      # Sidecar (dashboard e datasource): le dashboard del progetto sono ConfigMap con
      # l'etichetta `grafana_dashboard: "1"` nel namespace monitoring (observability/config).
      # I sidecar hanno un limite di memoria: senza, il chart non ne imposta.
      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
