# NetworkPolicy: component upstream (deny-all + una policy per servizio) più una
# restrizione dell'ingress del frontend.
# Limite noto: le policy upstream hanno `egress: [{}]`, quindi l'uscita non è limitata.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../../../kustomize/components/network-policies
patches:
  # Upstream il frontend accetta traffico da qualunque origine (`ingress: [{}]`).
  # Lo limitiamo a Traefik (ingress controller di k3s), al loadgenerator e a Prometheus
  # (namespace monitoring, fase 7), che raccoglie /metrics sulla stessa porta 8080.
  - target:
      kind: NetworkPolicy
      name: frontend
    patch: |-
      - op: replace
        path: /spec/ingress
        value:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: traefik
              - podSelector:
                  matchLabels:
                    app: loadgenerator
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: prometheus
            ports:
              - port: 8080
                protocol: TCP
  # redis-cart: upstream ammette solo il cartservice sulla 6379. Si aggiunge Prometheus sulla
  # 9121, la porta del sidecar redis_exporter (fase 5). Gli altri servizi restano esclusi.
  - target:
      kind: NetworkPolicy
      name: redis-cart
    patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: monitoring
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
          ports:
            - port: 9121
              protocol: TCP
