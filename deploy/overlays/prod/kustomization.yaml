# Ambiente prod: senza loadgenerator, repliche multiple sui servizi sul percorso utente,
# risorse del frontend più alte, host boutique-prod.localtest.me.
# Condivide cluster e nodo con dev: non c'è isolamento reale (vedi ADR 0001).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-prod
resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
  - redis-auth.enc.yaml
components:
  - ../../../kustomize/components/non-public-frontend
  - ../../../kustomize/components/without-loadgenerator
  - ../../components/network-policies
  - ../../components/arm64-workaround   # da rimuovere quando prod passa alle immagini GHCR (promozione, docs/ci.md §5)
labels:
  - pairs:
      environment: prod
    includeSelectors: false
    includeTemplates: true
replicas:
  - name: frontend
    count: 2
  - name: productcatalogservice
    count: 2
patches:
  # Il component without-loadgenerator toglie solo il Deployment: via anche ServiceAccount
  # e NetworkPolicy rimasti orfani.
  - target:
      kind: ServiceAccount
      name: loadgenerator
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: loadgenerator
  - target:
      kind: NetworkPolicy
      name: loadgenerator
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: loadgenerator
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 300m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
# Immagini: la base le fissa a v0.10.7 (upstream, solo amd64). Quando le immagini GHCR
# saranno verificate in dev, la promozione a prod è una PR che aggiunge qui il blocco
# `images` con il tag scelto (ADR 0003): la CI non tocca mai questo file.
