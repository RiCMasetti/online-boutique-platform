# Ambiente prod: senza loadgenerator, repliche multiple sui servizi sul percorso utente,
# risorse del frontend più alte, host boutique-prod.localtest.me.
# Condivide cluster e nodo con dev: non c'è isolamento reale (vedi ADR 0001).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-prod
resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
  - redis-auth.enc.yaml
components:
  - ../../../kustomize/components/non-public-frontend
  - ../../../kustomize/components/without-loadgenerator
  - ../../components/network-policies
  - ../../components/arm64-workaround   # da rimuovere con le immagini multi-arch (ADR 0002)
labels:
  - pairs:
      environment: prod
    includeSelectors: false
    includeTemplates: true
replicas:
  - name: frontend
    count: 2
  - name: productcatalogservice
    count: 2
patches:
  # Il component without-loadgenerator toglie solo il Deployment: via anche ServiceAccount
  # e NetworkPolicy rimasti orfani.
  - target:
      kind: ServiceAccount
      name: loadgenerator
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: loadgenerator
  - target:
      kind: NetworkPolicy
      name: loadgenerator
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: loadgenerator
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 300m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
# Tag delle immagini: prod si aggiorna solo con PR o tag esplicito (fase 4).
images:
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/adservice cartservice checkoutservice currencyservice emailservice frontend loadgenerator paymentservice productcatalogservice recommendationservice shippingservice
    newTag: v0.10.7
