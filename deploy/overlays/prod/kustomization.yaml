# Ambiente prod: senza loadgenerator, repliche multiple sui servizi sul percorso utente,
# risorse del frontend più alte, host boutique-prod.localtest.me.
# Condivide cluster e nodo con dev: non c'è isolamento reale (vedi ADR 0001).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-prod
resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
  - redis-auth.enc.yaml
components:
  - ../../../kustomize/components/non-public-frontend
  - ../../../kustomize/components/without-loadgenerator
  - ../../components/network-policies
labels:
  - pairs:
      environment: prod
    includeSelectors: false
    includeTemplates: true
replicas:
  - name: frontend
    count: 2
  - name: productcatalogservice
    count: 2
patches:
  # Il component without-loadgenerator toglie solo il Deployment: via anche ServiceAccount
  # e NetworkPolicy rimasti orfani.
  - target:
      kind: ServiceAccount
      name: loadgenerator
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: loadgenerator
  - target:
      kind: NetworkPolicy
      name: loadgenerator
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: loadgenerator
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 300m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
# Immagini di prod: quelle costruite dalla CI (multi-arch), nel tag già verificato in dev.
# Questo blocco si cambia SOLO con una PR di promozione (ADR 0003, docs/ci.md): la CI non lo
# tocca mai. Il loadgenerator non c'è in prod.
images:
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/adservice
    newName: ghcr.io/ricmasetti/online-boutique-platform/adservice
    newTag: e7eaa5b8b502
