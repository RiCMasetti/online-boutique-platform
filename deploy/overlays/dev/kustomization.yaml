# Ambiente dev: una replica per servizio, loadgenerator attivo, host boutique-dev.localtest.me.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-dev
resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
  - redis-auth.enc.yaml   # Secret cifrato con SOPS (caso costruito per la challenge)
components:
  # Rimuove il Service frontend-external (LoadBalancer): su k3d entrerebbe in conflitto
  # con Traefik sulla porta 80. L'accesso passa dall'Ingress.
  - ../../../kustomize/components/non-public-frontend
  - ../../components/network-policies
  - ../../components/arm64-workaround   # da rimuovere con le immagini multi-arch (ADR 0002)
  - ../../components/dev-images         # tag delle immagini, aggiornato dalla CI (workflow release)
labels:
  - pairs:
      environment: dev
    includeSelectors: false
    includeTemplates: true
