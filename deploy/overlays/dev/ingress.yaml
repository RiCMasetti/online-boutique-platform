# Ingress per Traefik (incluso in k3s). Il dominio *.localtest.me risolve a 127.0.0.1,
# quindi non serve modificare /etc/hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
spec:
  rules:
    - host: boutique-dev.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
