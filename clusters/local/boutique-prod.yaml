# Ambiente prod: segue il branch `prod`, non `main`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: boutique-prod
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: infrastructure
  path: ./deploy/overlays/prod
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: boutique-prod
  decryption:
    provider: sops
    secretRef:
      name: sops-age
