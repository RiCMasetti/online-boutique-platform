# Ambiente dev: segue il branch `main` (GitRepository `flux-system`).
# Ogni commit su main viene applicato senza kubectl apply manuale.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: boutique-dev
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: infrastructure
  path: ./deploy/overlays/dev
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age   # creato da scripts/flux-bootstrap.sh, mai committato
