# ServiceMonitor, regole e dashboard: richiedono i CRD installati dallo stack.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: observability-stack
  path: ./observability/config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
